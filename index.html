<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="From idea to running product. One engineer, the whole chain. I build and ship complete products — interface, backend, cloud, and the AI features where they earn their place."
    />
    <meta name="turnstile-site-key" content="0x4AAAAAAEM87e-TffCeAaTl" />
    <meta name="theme-color" content="#0d1008" />
    <title>Mike Pattyn</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        var t = localStorage.getItem("theme");
        if (t === "dark" || t === "light") {
          document.documentElement.dataset.theme = t;
          document.documentElement.style.colorScheme = t;
        }
        var pathLocale = (location.pathname.match(/^\/(en|nl)(?=\/|$)/) || [])[1];
        if (pathLocale) document.documentElement.lang = pathLocale;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app.tsx"></script>
  </body>
</html>
